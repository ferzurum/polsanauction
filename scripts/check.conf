# scripts/check.conf — Polsan Auction (.NET 10 + React/TS/Vite + PostgreSQL). Spec 0001.
# One step per line:  <name>: <command>   — runs in order, fails fast. [fast] in the NAME = fast profile.
# Full needs Docker running (integration tests); fast does not.
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene):
# - every dotnet step (build, format, test, list package): MSBuild node reuse, MSBuild server and the Roslyn VBCSCompiler server can
#   survive the run -> MSBUILDDISABLENODEREUSE=1, DOTNET_CLI_USE_MSBUILD_SERVER=0,
#   --disable-build-servers, UseSharedCompilation=false
# - dotnet test (Microsoft.Testing.Platform, plan 0001 A-1): each test exe exits with the run;
#   --no-build so it never starts a second build
# - Testcontainers: the PostgreSQL container is disposed by the test fixture, also on failure;
#   Ryuk removes containers of a run killed halfway and then exits (rule 5: fresh DB every run)
# - vitest: "vitest run" + watch: false (never watch mode); workers end with the run
# - npm / oxlint / prettier / tsc / vite build: run-once commands, nothing stays behind
#
# Test split by selector, never by project list (docs/testing.md, Two speeds, rule 4):
# Category=Integration is full-only, everything else is fast. --ignore-exit-code 8 = "zero tests in
# one assembly" — expected, because each selection matches tests in only some of the assemblies.
#
# resource hygiene: no MSBuild node reuse / build servers
build [fast]: MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet build -c Release --disable-build-servers -p:UseSharedCompilation=false
format [fast]: MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet format --verify-no-changes
# resource hygiene: no MSBuild node reuse, no rebuild in test; test exes exit with the run
unit+architecture tests [fast]: MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet test -c Release --no-build --filter-not-trait "Category=Integration" --ignore-exit-code 8
web install [fast]: npm --prefix web ci --no-audit --no-fund
web lint [fast]: npm --prefix web run lint
web typecheck [fast]: npm --prefix web run typecheck
# resource hygiene: vitest run (no watch mode)
web tests [fast]: npm --prefix web run test
# resource hygiene: no MSBuild node reuse; Testcontainers disposes PostgreSQL per run; Ryuk reaps a killed run
integration tests: MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet test -c Release --no-build --filter-trait "Category=Integration" --ignore-exit-code 8
web build: npm --prefix web run build
# JSON output: its keys are English in every locale; a finding carries a "vulnerabilities" array
vulnerable packages: sh -c 'out=$(MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet list package --vulnerable --include-transitive --format json) || exit 1; if echo "$out" | grep -q "\"vulnerabilities\""; then echo "$out"; exit 1; fi; echo "no vulnerable NuGet packages"'
npm audit: npm --prefix web audit --audit-level=high
