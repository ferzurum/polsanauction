# scripts/check.conf — Polsan Auction (.NET 10 + React/TS/Vite + PostgreSQL). Bootstrap 2026-10-29.
# One step per line:  <name>: <command>   — runs in order, fails fast. [fast] in the NAME = fast profile.
#
# GREENFIELD: henüz kod yok, bu yüzden tüm adımlar yorum satırı (check = no-op).
# İlk iskelet spec'i (solution + web/ + tests/) bu satırların başındaki "# " işaretini kaldırır,
# ardından residue testini (./scripts/residue ve --fast) boş bir makinede çalıştırır ve
# her test adımının test sayısının seçici eklenmeden önceki sayıyla aynı olduğunu doğrular.
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene):
# - dotnet build: MSBuild node reuse + MSBuild server + Roslyn VBCSCompiler sunucusu geride kalabilir
#   -> --disable-build-servers, MSBUILDDISABLENODEREUSE=1, DOTNET_CLI_USE_MSBUILD_SERVER=0, UseSharedCompilation=false
# - dotnet test: testhost süreci koşu sonunda kapanır; build'i tekrar etmesin diye --no-build
# - Testcontainers: PostgreSQL konteyneri fixture DisposeAsync ile kapanır; Ryuk reaper yarıda
#   öldürülen koşuların konteynerlerini temizler (rule 5: her koşu taze DB)
# - vitest: watch modu açık kalır -> her zaman "vitest run" (package.json "test" script'i)
# - npm/vite: kalıcı süreç bırakmaz; dev server check'te asla çalışmaz (rule 4)
#
# resource hygiene: no MSBuild node reuse / build servers
# build [fast]: MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet build -c Release --disable-build-servers -p:UseSharedCompilation=false
# format [fast]: MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet format --verify-no-changes
# resource hygiene: no rebuild in test, testhost exits; split by selector, never by project list
# unit+architecture tests [fast]: dotnet test -c Release --no-build --filter "Category!=Integration"
# resource hygiene: Testcontainers disposes PostgreSQL per run; needs Docker running
# integration tests: dotnet test -c Release --no-build --filter "Category=Integration"
# web install [fast]: npm --prefix web ci --no-audit --no-fund
# web lint [fast]: npm --prefix web run lint
# web typecheck [fast]: npm --prefix web run typecheck
# resource hygiene: vitest run (no watch mode)
# web tests [fast]: npm --prefix web run test
# web build: npm --prefix web run build
# vulnerable packages: sh -c 'out=$(dotnet list package --vulnerable --include-transitive) || exit 1; echo "$out"; ! echo "$out" | grep -q "has the following vulnerable packages"'
# npm audit: npm --prefix web audit --audit-level=high
